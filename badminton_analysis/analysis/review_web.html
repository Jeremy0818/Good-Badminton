<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally Review</title>
<style>
  :root {
    --bg: #f4f5f2; --panel: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #dfe3df;
    --court: #2f6b3a; --court-line: #f5f7f2; --in: #2f9e5b; --out: #d64545; --accent: #2563eb;
    --far: #c2410c; --near: #0e7490; --warn: #b45309; --chip: #eef1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --panel: #1b201d; --ink: #e8ece9; --muted: #98a29d; --line: #2c332f;
      --court: #24543a; --court-line: #dfe7e1; --in: #4ade80; --out: #f87171; --accent: #60a5fa;
      --far: #fb923c; --near: #22d3ee; --warn: #fbbf24; --chip: #232a26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; padding: 16px 20px 8px; }
  header h1 { font-size: 18px; margin: 0; }
  .score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 8px 20px 24px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  /* Just under 1 opacity keeps the video out of the hardware overlay plane, which would hide the marker. */
  video { display: block; width: 100%; opacity: .999; }
  .marker { position: absolute; width: 7%; aspect-ratio: 1; transform: translate(-50%, -50%);
            border: 4px solid var(--in); border-radius: 50%; pointer-events: none; display: none; }
  .marker.out { border-color: var(--out); }
  .marker span { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 4px;
                 font: 700 14px sans-serif; color: var(--in); text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .marker.out span { color: var(--out); }
  .marker.lost { border: 3px dashed #c8ccc9; }
  .marker.lost span { color: #e5e7e6; font-size: 12px; white-space: nowrap; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 6px; flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 16px; }
  .sides { display: flex; gap: 16px; flex-wrap: wrap; }
  .side-far { color: var(--far); font-weight: 600; }
  .side-near { color: var(--near); font-weight: 600; }
  .call { font-size: 16px; margin: 4px 0; }
  .call b.in { color: var(--in); } .call b.out { color: var(--out); } .call b.lost { color: var(--muted); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; }
  .chip.high { color: var(--in); } .chip.medium { color: var(--warn); } .chip.low { color: var(--out); }
  .flags { margin: 6px 0 0; padding-left: 18px; color: var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button kbd { font: 11px ui-monospace, monospace; opacity: .75; margin-left: 6px; }
  .decision { margin-top: 10px; font-weight: 600; color: var(--accent); min-height: 20px; }
  aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  aside h3 { margin: 0 0 8px; font-size: 14px; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 12px; font-size: 12px; margin-top: 6px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .list { max-height: 360px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  tr { cursor: pointer; } tr.current { background: var(--chip); }
  .st-auto { color: var(--muted); } .st-ok { color: var(--in); } .st-changed { color: var(--warn); }
  .progress { height: 6px; background: var(--chip); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .progress div { height: 100%; background: var(--accent); }
  .stage { max-width: calc(54vh * 16 / 9); margin: 0 auto; }
  /* Touch-down close-up: zoomed slow-motion video and a 3D view of the mark. */
  .touch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 700px) { .touch { grid-template-columns: 1fr; } }
  .pane { position: relative; background: #0b1410; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; }
  .pane .tag { position: absolute; left: 8px; top: 6px; z-index: 2; font: 600 12px sans-serif; color: #fff;
               text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  .pane .ctrl { position: absolute; left: 6px; bottom: 6px; z-index: 2; display: flex; gap: 6px; }
  .pane .ctrl button { padding: 2px 8px; font-size: 12px; background: rgba(0, 0, 0, .55); color: #fff;
                       border-color: rgba(255, 255, 255, .3); }
  .pane .empty { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 16px;
                 text-align: center; color: #b7c2bc; font-size: 13px; background: #0b1410; }
  .pane .empty[hidden] { display: none; }
  #zwrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #zwrap video, #zwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #zlines .band { fill: rgba(34, 211, 238, .10); stroke: #22d3ee; stroke-width: 1; vector-effect: non-scaling-stroke; }
  #zlines .trk { fill: #fde047; opacity: .25; }
  #zlines .trk.seen { opacity: .8; }
  #zlines .trk.now { fill: #fff; opacity: 1; }
  #zlines .td { fill: none; stroke: var(--in); stroke-width: 2; vector-effect: non-scaling-stroke; }
  #zlines .td.out { stroke: var(--out); }
  #view3d { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .readout { position: absolute; right: 8px; bottom: 6px; z-index: 2; text-align: right; font: 600 14px/1.35 sans-serif;
             color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  .readout b.in { color: #4ade80; } .readout b.out { color: #f87171; }
  .readout span { font-size: 12px; font-weight: 500; }
  .readout .warn { color: #fbbf24; }
</style>
</head>
<body>
<header>
  <h1>Rally Review</h1>
  <span class="score" id="score">–</span>
  <span class="muted" id="summary"></span>
</header>
<main>
  <section class="card">
    <div class="stage">
      <video id="video" src="/video" preload="auto" muted playsinline></video>
      <div class="marker" id="marker"><span></span></div>
    </div>
    <div class="touch">
      <div class="pane" id="zpane">
        <div id="zwrap">
          <video id="zvideo" src="/video" preload="auto" muted playsinline></video>
          <svg id="zlines" preserveAspectRatio="none"></svg>
        </div>
        <div class="tag" id="ztag">Touch-down · ¼ speed · court lines in blue</div>
        <div class="ctrl"><button id="zplay">Pause</button><button id="zback">◀ frame</button>
          <button id="zfwd">frame ▶</button><button id="zspeed">¼×</button></div>
        <div class="empty" id="zempty" hidden></div>
      </div>
      <div class="pane" id="tpane">
        <canvas id="view3d"></canvas>
        <div class="tag" title="Drag to turn, scroll to zoom, double-click to reset">3D close-up · drag to turn</div>
        <div class="readout" id="readout"></div>
        <div class="empty" id="tempty" hidden></div>
      </div>
    </div>
    <div class="bar">
      <h2 id="title">Loading…</h2>
      <div class="sides"><span>Far: <span class="side-far" id="far"></span></span>
        <span>Near: <span class="side-near" id="near"></span></span></div>
    </div>
    <div class="call" id="call"></div>
    <div id="auto"></div>
    <ul class="flags" id="flags"></ul>
    <div class="actions">
      <button class="primary" data-choice="accept">Accept<kbd>Enter</kbd></button>
      <button data-choice="near">Near won<kbd>N</kbd></button>
      <button data-choice="far">Far won<kbd>F</kbd></button>
      <button data-choice="none">Not a rally<kbd>X</kbd></button>
      <button id="replay">Replay<kbd>R</kbd></button>
      <button id="prev">Back<kbd>B / ←</kbd></button>
      <button id="next">Skip<kbd>→</kbd></button>
    </div>
    <div class="decision" id="decision"></div>
  </section>
  <aside>
    <div class="card">
      <h3>Landings</h3>
      <svg id="court" viewBox="-1.6 -1.6 9.3 16.6"></svg>
      <div class="legend"><span><span class="dot" style="background:var(--in)"></span>in</span>
        <span><span class="dot" style="background:var(--out)"></span>out</span>
        <span><span class="dot" style="border:1.5px solid var(--muted)"></span>lost in flight</span>
        <span class="muted">click a dot to open its rally</span></div>
    </div>
    <div class="card">
      <h3>Rallies</h3>
      <div class="progress"><div id="bar" style="width:0"></div></div>
      <div class="list"><table><thead><tr><th>#</th><th>Call</th><th>Winner</th><th>Score</th><th></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>
  </aside>
</main>
<script>
const W = 6.1, L = 13.4, NET = 6.7, SM = 0.46, SL = 1.98, BS = 0.76;
const video = document.getElementById("video");
const $ = id => document.getElementById(id);
let state = null, current = 0;

const sideLabel = s => s === "upper" ? "far" : "near";
// Lost in flight: the position is where the shuttle was last tracked in the air, not where it
// landed. Mapped to the floor it often ends up on the wrong side, so it is not shown as a landing.
const lost = r => r.landing_method === "last_seen";
const hasLanding = r => r.landing_court && (r.call === "in" || r.call === "out");
const winnerText = (side, r) => side ? `${r.sides[side]} (${sideLabel(side)})` : "–";

async function load() {
  state = await (await fetch("/api/state")).json();
  drawCourt();
  select(Math.min(state.next_index, state.rallies.length - 1), true);
}

function render() {
  const r = state.rallies[current];
  const [a, b] = state.names;
  $("score").textContent = `${a} ${state.final_score} ${b}`;
  $("summary").textContent = `${state.reviewed}/${state.rallies.length} reviewed · ${state.changed} automatic calls changed`;
  $("bar").style.width = `${100 * state.reviewed / state.rallies.length}%`;
  $("title").textContent = `Rally ${current + 1}/${state.rallies.length} · Game ${r.game} · ${a} ${r.score_before[0]}–${r.score_before[1]} ${b}`;
  $("far").textContent = r.sides.upper;
  $("near").textContent = r.sides.lower;
  if (hasLanding(r) && lost(r)) {
    $("call").innerHTML = `<b class="lost">Landing not seen</b>: shuttle lost in flight` +
      ` <span class="muted">(automatic guess: ${r.call} on the ${sideLabel(r.landing_side)} side)</span>`;
  } else if (r.call === "in" || r.call === "out") {
    const margin = r.margin_m == null ? "" : ` by ${Math.abs(r.margin_m).toFixed(2)} m`;
    $("call").innerHTML = `Shuttle <b class="${r.call}">${r.call.toUpperCase()}</b> on the ${sideLabel(r.landing_side)} side${margin}`;
  } else {
    $("call").textContent = "No landing found";
  }
  const guess = lost(r) ? " (guess)" : "";
  $("auto").innerHTML = `Automatic: <b>${r.predicted_side ? winnerText(r.predicted_side, r) + " wins" + guess : "undecided"}</b> ` +
    `<span class="chip ${r.confidence}">${r.confidence} confidence</span>`;
  $("flags").innerHTML = r.flags.map(f => `<li>${f}</li>`).join("");
  $("decision").textContent = r.decision == null ? "" :
    r.decision === "none" ? "Your call: not a rally" : `Your call: ${winnerText(r.decision, r)} wins`;
  renderRows();
  highlightCourt();
}

function renderRows() {
  $("rows").innerHTML = state.rallies.map((r, i) => {
    const call = !hasLanding(r) ? "–" : lost(r) ? "not seen" : `${r.call} ${sideLabel(r.landing_side)}`;
    const st = !r.reviewed ? ["auto", "st-auto"] : r.changed ? ["changed", "st-changed"] : ["✓", "st-ok"];
    const score = r.score_after ? r.score_after.join("–") : "–";
    const who = r.winner_side ? r.sides[r.winner_side] : (r.decision === "none" ? "not a rally" : "?");
    return `<tr data-i="${i}" class="${i === current ? "current" : ""}"><td>${i + 1}</td><td>${call}</td>` +
      `<td>${who}</td><td>${score}</td><td class="${st[1]}">${st[0]}</td></tr>`;
  }).join("");
  // Scroll only the list, not the page, so the video stays in view.
  const row = $("rows").querySelector("tr.current"), list = row && row.closest(".list");
  if (row && (row.offsetTop < list.scrollTop + 30 || row.offsetTop > list.scrollTop + list.clientHeight - 30)) {
    list.scrollTop = row.offsetTop - list.clientHeight / 2;
  }
}

function drawCourt() {
  const svg = $("court");
  const line = (x1, y1, x2, y2, extra = "") =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--court-line)" stroke-width="0.05" ${extra}/>`;
  let html = `<rect x="-1.6" y="-1.6" width="9.3" height="16.6" fill="var(--panel)"/>` +
    `<rect x="0" y="0" width="${W}" height="${L}" fill="var(--court)"/>`;
  html += line(0, 0, W, 0) + line(W, 0, W, L) + line(W, L, 0, L) + line(0, L, 0, 0);
  html += line(SM, 0, SM, L) + line(W - SM, 0, W - SM, L);
  html += line(0, NET - SL, W, NET - SL) + line(0, NET + SL, W, NET + SL);
  html += line(0, BS, W, BS) + line(0, L - BS, W, L - BS);
  html += line(W / 2, 0, W / 2, NET - SL) + line(W / 2, NET + SL, W / 2, L);
  html += line(-0.3, NET, W + 0.3, NET, 'stroke-width="0.09" stroke-dasharray="0.15 0.1"');
  html += `<text x="${W / 2}" y="-0.5" font-size="0.5" text-anchor="middle" fill="var(--muted)">far</text>`;
  html += `<text x="${W / 2}" y="${L + 0.9}" font-size="0.5" text-anchor="middle" fill="var(--muted)">near</text>`;
  state.rallies.forEach((r, i) => {
    if (!hasLanding(r)) return;
    const x = Math.max(-1.4, Math.min(r.landing_court[0], 7.5));
    const y = Math.max(-1.4, Math.min(r.landing_court[1], 14.8));
    html += lost(r)
      ? `<circle data-i="${i}" cx="${x}" cy="${y}" r="0.14" fill="var(--panel)" fill-opacity="0.01" stroke="var(--muted)" stroke-width="0.06" style="cursor:pointer"/>`
      : `<circle data-i="${i}" cx="${x}" cy="${y}" r="0.16" fill="var(--${r.call})" stroke="var(--panel)" stroke-width="0.04" style="cursor:pointer"/>`;
  });
  html += `<circle id="cur" r="0.34" fill="none" stroke="var(--accent)" stroke-width="0.08" visibility="hidden"/>`;
  svg.innerHTML = html;
}

function highlightCourt() {
  const r = state.rallies[current], cur = $("cur");
  if (hasLanding(r)) {
    cur.setAttribute("cx", Math.max(-1.4, Math.min(r.landing_court[0], 7.5)));
    cur.setAttribute("cy", Math.max(-1.4, Math.min(r.landing_court[1], 14.8)));
    cur.setAttribute("visibility", "visible");
  } else cur.setAttribute("visibility", "hidden");
}

function select(i, play = true) {
  current = Math.max(0, Math.min(i, state.rallies.length - 1));
  render();
  updateTouch();
  if (play) replay();
}

function replay() {
  const r = state.rallies[current];
  video.currentTime = r.clip_start;
  video.play().catch(() => {});
}

function updateMarker() {
  const r = state && state.rallies[current], m = $("marker");
  const show = r && r.landing_image && r.landing_time != null &&
    video.currentTime >= r.landing_time - 0.02 && video.currentTime <= r.clip_end + 0.05;
  if (show) {
    m.style.left = `${100 * r.landing_image[0] / state.video.width}%`;
    m.style.top = `${100 * r.landing_image[1] / state.video.height}%`;
    m.className = `marker ${lost(r) ? "lost" : r.call}`;
    m.firstChild.textContent = lost(r) ? "LAST SEEN" : r.call.toUpperCase();
  }
  m.style.display = show ? "block" : "none";
}

function drawOverlay() {
  updateMarker();
  stopAtClipEnd();
  loopZoom();
  updateTrack();
  requestAnimationFrame(drawOverlay);
}

function stopAtClipEnd() {
  const r = state && state.rallies[current];
  if (r && !video.paused && video.currentTime >= r.clip_end) {
    video.pause();
    video.currentTime = r.clip_end;  // hold the last court-camera frame
  }
}
// timeupdate keeps firing when the tab is in the background, unlike requestAnimationFrame.
video.addEventListener("timeupdate", stopAtClipEnd);
video.addEventListener("seeked", updateMarker);
video.addEventListener("pause", updateMarker);

async function decide(choice) {
  const res = await fetch("/api/decide", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ index: current, choice }) });
  const data = await res.json();
  if (!res.ok) { $("decision").textContent = data.error === "no automatic call to accept"
      ? "No automatic call here: pick Near won, Far won or Not a rally." : data.error; return; }
  state = data;
  drawCourt();
  select(current + 1);
}

document.querySelectorAll("button[data-choice]").forEach(b => b.onclick = () => decide(b.dataset.choice));
$("replay").onclick = replay;
$("prev").onclick = () => select(current - 1);
$("next").onclick = () => select(current + 1);
$("rows").onclick = e => { const tr = e.target.closest("tr"); if (tr) select(+tr.dataset.i); };
$("court").onclick = e => { const i = e.target.getAttribute("data-i"); if (i != null) select(+i); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const act = { enter: () => decide("accept"), " ": () => decide("accept"), n: () => decide("near"),
    f: () => decide("far"), x: () => decide("none"), r: replay, b: () => select(current - 1),
    arrowleft: () => select(current - 1), arrowright: () => select(current + 1) }[k];
  if (act) { e.preventDefault(); act(); }
});
// ---- Touch-down close-up ----
const LW = 0.04;  // painted lines are 4 cm wide; boundary lines lie inside the area they bound
const zv = $("zvideo");
const SPEEDS = [0.25, 0.5, 1];
const SPEED_LABEL = { 0.25: "¼", 0.5: "½", 1: "1" };
let zSpeed = 0.25, cam = { az: 0, el: 35, dist: 1.8 }, drag = null, lastDot = -2;

const showTouch = r => hasLanding(r) && !lost(r) && r.landing_image && r.landing_time != null;

function lineBands() {  // [x0, y0, x1, y1] in court metres
  return [
    [0, 0, W, LW], [0, L - LW, W, L], [0, 0, LW, L], [W - LW, 0, W, L],                        // outer boundary
    [SM, 0, SM + LW, L], [W - SM - LW, 0, W - SM, L],                                           // singles sidelines
    [0, BS - LW / 2, W, BS + LW / 2], [0, L - BS - LW / 2, W, L - BS + LW / 2],                 // doubles long service
    [0, NET - SL - LW / 2, W, NET - SL + LW / 2], [0, NET + SL - LW / 2, W, NET + SL + LW / 2], // short service
    [W / 2 - LW / 2, 0, W / 2 + LW / 2, NET - SL], [W / 2 - LW / 2, NET + SL, W / 2 + LW / 2, L], // centre
  ];
}

function toImage(x, y) {
  const m = state.court_to_image, w = m[2][0] * x + m[2][1] * y + m[2][2];
  return [(m[0][0] * x + m[0][1] * y + m[0][2]) / w, (m[1][0] * x + m[1][1] * y + m[1][2]) / w];
}

function decidingLine(r) {
  // The boundary that decides the call: smallest signed distance, positive inside (as in line_calls).
  const [x, y] = r.landing_court, singles = state.match_type !== "doubles";
  const lo = singles ? SM : 0, hi = singles ? W - SM : W;
  return [{ m: x - lo, n: [-1, 0], axis: 0 }, { m: hi - x, n: [1, 0], axis: 0 },
          { m: y, n: [0, -1], axis: 1 }, { m: L - y, n: [0, 1], axis: 1 }].reduce((a, b) => b.m < a.m ? b : a);
}

function updateTouch() {
  const r = state.rallies[current], ok = showTouch(r);
  for (const id of ["zempty", "tempty"]) {
    $(id).hidden = ok;
    $(id).textContent = !hasLanding(r) ? "No landing found."
      : "Landing not seen: the shuttle was lost in the air, so there is no touch-down to show.";
  }
  $("readout").innerHTML = "";
  if (!ok) { zv.pause(); return; }
  cam = { az: 0, el: 35, dist: 1.8 };
  layoutZoom();
  drawZoomLines();
  draw3d();
  readout();
  zv.defaultPlaybackRate = zv.playbackRate = zSpeed;
  zv.currentTime = zoomWindow(r)[0];
  zv.play().catch(() => {});
  $("zplay").textContent = "Pause";
}

function zoomWindow(r) {
  return [Math.max(r.clip_start, r.landing_time - 0.6), Math.min(r.clip_end, r.landing_time + 0.5)];
}

function layoutZoom() {
  const r = state.rallies[current], pane = $("zpane"), wrap = $("zwrap"), V = state.video;
  if (!showTouch(r)) return;
  const k = pane.clientHeight / (0.16 * V.height);  // show about a sixth of the frame height
  wrap.style.width = `${V.width}px`;
  wrap.style.height = `${V.height}px`;
  wrap.style.transform = `translate(${pane.clientWidth / 2 - r.landing_image[0] * k}px, ` +
    `${pane.clientHeight / 2 - r.landing_image[1] * k}px) scale(${k})`;
}

function drawZoomLines() {
  // Lines where the court mapping puts them: they should sit on the painted lines.
  const r = state.rallies[current], V = state.video, svg = $("zlines");
  svg.setAttribute("viewBox", `0 0 ${V.width} ${V.height}`);
  let html = "";
  if (state.court_to_image) {
    for (const [x0, y0, x1, y1] of lineBands()) {
      const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(p => toImage(p[0], p[1]).map(v => v.toFixed(1)).join(","));
      html += `<polygon class="band" points="${pts.join(" ")}"/>`;
    }
  }
  r.track.forEach(([, x, y]) => { html += `<circle class="trk" cx="${x}" cy="${y}" r="${V.height * 0.0035}"/>`; });
  html += `<circle class="td ${r.call}" cx="${r.landing_image[0]}" cy="${r.landing_image[1]}" r="${V.height * 0.01}"/>`;
  svg.innerHTML = html;
  lastDot = -2;
}

function updateTrack() {
  // Shuttle positions up to the frame on screen; the latest one in white.
  const r = state && state.rallies[current];
  if (!r || !showTouch(r)) return;
  let now = -1;
  r.track.forEach(([t], i) => { if (t <= zv.currentTime + 0.001) now = i; });
  if (now === lastDot) return;
  lastDot = now;
  $("zlines").querySelectorAll(".trk").forEach((c, i) =>
    c.setAttribute("class", i < now ? "trk seen" : i === now ? "trk now" : "trk"));
}

function loopZoom() {
  const r = state && state.rallies[current];
  if (!r || !showTouch(r) || zv.paused) return;
  const [a, b] = zoomWindow(r);
  if (zv.currentTime >= b || zv.currentTime < a - 0.1) zv.currentTime = a;
}
zv.addEventListener("timeupdate", loopZoom);

function stepFrame(d) {
  const [a, b] = zoomWindow(state.rallies[current]);
  zv.pause();
  $("zplay").textContent = "Play";
  zv.currentTime = Math.max(a, Math.min(b, zv.currentTime + d / state.video.fps));
}
$("zback").onclick = () => stepFrame(-1);
$("zfwd").onclick = () => stepFrame(1);
$("zplay").onclick = () => {
  if (zv.paused) { zv.play().catch(() => {}); $("zplay").textContent = "Pause"; }
  else { zv.pause(); $("zplay").textContent = "Play"; }
};
$("zspeed").onclick = () => {
  zSpeed = SPEEDS[(SPEEDS.indexOf(zSpeed) + 1) % SPEEDS.length];
  zv.defaultPlaybackRate = zv.playbackRate = zSpeed;
  $("zspeed").textContent = `${SPEED_LABEL[zSpeed]}×`;
  $("ztag").textContent = `Touch-down · ${zSpeed === 1 ? "full" : SPEED_LABEL[zSpeed]} speed · court lines in blue`;
};

function normalCdf(z) {  // Abramowitz & Stegun 7.1.26
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const erf = 1 - (((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t)
    * Math.exp(-z * z / 2);
  return z >= 0 ? 0.5 * (1 + erf) : 0.5 * (1 - erf);
}

function readout() {
  const r = state.rallies[current], d = decidingLine(r), call = d.m >= 0 ? "in" : "out";
  const sigma = r.landing_error_m ? r.landing_error_m[d.axis] : null;
  let html = `<b class="${call}">${call.toUpperCase()}</b> by ${Math.round(Math.abs(d.m) * 100)} cm`;
  if (sigma) {
    // Chance the shuttle really landed on this side of the line, given the error of the estimate.
    const sure = normalCdf(Math.abs(d.m) / sigma);
    const note = sure >= 0.95 ? "" : sure >= 0.8 ? " · likely" : " · too close to call";
    html += `<br><span class="${sure >= 0.95 ? "" : "warn"}">±${Math.round(sigma * 100)} cm · ${Math.round(100 * sure)}% sure${note}</span>`;
  }
  if (r.landing_method === "held") html += `<br><span class="warn">near a hand: caught or picked up?</span>`;
  $("readout").innerHTML = html;
}

// 3D view: z is up; court x across, y along. Seen from inside the court, looking out over the deciding line.
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit3 = a => { const n = Math.hypot(...a); return [a[0] / n, a[1] / n, a[2] / n]; };

function clipNear(q, near = 0.02) {  // keep the part of a camera-space polygon in front of the camera
  const out = [];
  q.forEach((a, i) => {
    const b = q[(i + 1) % q.length];
    if (a[2] >= near) out.push(a);
    if ((a[2] >= near) !== (b[2] >= near)) {
      const t = (near - a[2]) / (b[2] - a[2]);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, near]);
    }
  });
  return out;
}

function hull(pts) {  // convex hull, monotone chain
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const turn = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = list => list.reduce((h, p) => {
    while (h.length >= 2 && turn(h[h.length - 2], h[h.length - 1], p) <= 0) h.pop();
    h.push(p);
    return h;
  }, []);
  const lower = half(pts), upper = half(pts.slice().reverse());
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function draw3d() {
  const r = state.rallies[current], canvas = $("view3d");
  const cw = canvas.clientWidth, ch = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0b1410";
  g.fillRect(0, 0, cw, ch);
  if (!showTouch(r)) return;

  const d = decidingLine(r), [mx, my] = r.landing_court;
  const shift = Math.max(-0.5, Math.min(0.5, d.m)) / 2;  // aim between the mark and the line
  const target = [mx + d.n[0] * shift, my + d.n[1] * shift, 0];
  const yaw = Math.atan2(-d.n[1], -d.n[0]) + cam.az * Math.PI / 180, pitch = cam.el * Math.PI / 180;
  const eye = [target[0] + cam.dist * Math.cos(pitch) * Math.cos(yaw),
               target[1] + cam.dist * Math.cos(pitch) * Math.sin(yaw), cam.dist * Math.sin(pitch)];
  // Court coordinates are mirrored (y runs toward the near camera), so right = up x forward.
  const fwd = unit3(sub3(target, eye)), right = unit3(cross3([0, 0, 1], fwd)), up = cross3(fwd, right);
  const focal = (ch / 2) / Math.tan(25 * Math.PI / 180);
  const toCam = p => { const v = sub3(p, eye); return [dot3(v, right), dot3(v, up), dot3(v, fwd)]; };
  const toScreen = q => [cw / 2 + focal * q[0] / q[2], ch / 2 - focal * q[1] / q[2]];
  const path = q => { g.beginPath(); q.forEach((p, i) => { const s = toScreen(p); i ? g.lineTo(...s) : g.moveTo(...s); }); g.closePath(); };
  const poly = (pts, fill, stroke, dash) => {
    const q = clipNear(pts.map(toCam));
    if (q.length < 3) return;
    path(q);
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.setLineDash(dash || []); g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); g.setLineDash([]); }
  };
  const rect = (x0, y0, x1, y1) => [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0]];
  const ring = (cx, cy, rx, ry, z = 0, n = 48) =>
    Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n), z]);
  const singles = state.match_type !== "doubles";

  poly(rect(-8, -8, W + 8, L + 8), "#1c3a26");                                      // floor outside
  poly(singles ? rect(SM, 0, W - SM, L) : rect(0, 0, W, L), "#2f6b3a");              // in
  for (const [x0, y0, x1, y1] of lineBands()) poly(rect(x0, y0, x1, y1), "#f4f6f1"); // painted lines
  // Net: posts on the doubles sidelines, mesh from 0.76 m to the tape at 1.55 m.
  const netBehind = Math.abs(NET - eye[1]) > Math.abs(NET - my);
  const drawNet = () => {
    poly([[0, NET, 0.76], [W, NET, 0.76], [W, NET, 1.55], [0, NET, 1.55]], "rgba(10, 12, 11, .55)");
    poly([[0, NET, 1.49], [W, NET, 1.49], [W, NET, 1.55], [0, NET, 1.55]], "#f4f6f1");
  };
  if (netBehind) drawNet();

  const color = r.call === "out" ? "#f87171" : "#4ade80";
  if (r.landing_error_m) {                                                            // 1-sigma error ring
    poly(ring(mx, my, r.landing_error_m[0], r.landing_error_m[1]), "rgba(255, 255, 255, .10)", "rgba(255, 255, 255, .85)", [6, 4]);
  }
  poly(ring(mx, my, 0.0135, 0.0135, 0, 24), color);                                  // where the cork touched
  // The shuttle standing on its cork: cork ball, then the feather skirt as the hull of its two rims.
  const cork = toCam([mx, my, 0.014]);
  if (cork[2] > 0.05) {
    const c = toScreen(cork);
    g.beginPath(); g.arc(c[0], c[1], focal * 0.014 / cork[2], 0, 2 * Math.PI);
    g.fillStyle = "#e9e4d8"; g.fill(); g.strokeStyle = "#6b7280"; g.lineWidth = 1; g.stroke();
    const rims = ring(mx, my, 0.012, 0.012, 0.024, 24).concat(ring(mx, my, 0.033, 0.033, 0.09, 24)).map(toCam);
    if (rims.every(q => q[2] > 0.05)) {
      const skirt = hull(rims.map(toScreen));
      g.beginPath(); skirt.forEach((s, i) => i ? g.lineTo(...s) : g.moveTo(...s)); g.closePath();
      g.fillStyle = "rgba(250, 250, 248, .85)"; g.fill(); g.strokeStyle = "#9ca3af"; g.stroke();
    }
  }
  if (!netBehind) drawNet();
}

const canvas3d = $("view3d");
canvas3d.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, az: cam.az, el: cam.el };
  canvas3d.setPointerCapture(e.pointerId);
});
canvas3d.addEventListener("pointermove", e => {
  if (!drag) return;
  cam.az = drag.az - (e.clientX - drag.x) * 0.4;
  cam.el = Math.max(5, Math.min(89, drag.el + (e.clientY - drag.y) * 0.3));
  draw3d();
});
canvas3d.addEventListener("pointerup", () => { drag = null; });
canvas3d.addEventListener("wheel", e => {
  e.preventDefault();
  cam.dist = Math.max(0.4, Math.min(12, cam.dist * Math.exp(e.deltaY * 0.001)));
  draw3d();
}, { passive: false });
canvas3d.addEventListener("dblclick", () => { cam = { az: 0, el: 35, dist: 1.8 }; draw3d(); });
window.addEventListener("resize", () => { if (state) { layoutZoom(); draw3d(); } });

requestAnimationFrame(drawOverlay);
load();
</script>
</body>
</html>
